name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The engine reproduces the BSD userland of macOS, and the differential tests compare it
    # with the system tools: they need a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Benchmark helper checks (no model calls)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 docs/benchmarks/2026-11-23-diagnose/verify_helpers.py
      - name: Test
        # Scout's wall-clock resource bounds also apply in tests. Avoid parallel
        # Git process startup contention on shared runners; keep all assertions.
        run: cargo test --locked --all-targets -- --test-threads 1
      - name: Public replay fixture
        run: |
          cargo build --locked
          cargo run --locked --example replay -- --fixture --mcp target/debug/kiro
