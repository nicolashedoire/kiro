name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The engine reproduces the BSD userland of macOS, and the differential tests compare it
    # with the system tools: they need a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Public replay fixture
        run: |
          cargo build --locked
          cargo run --locked --example replay -- --fixture --mcp target/debug/kiro
